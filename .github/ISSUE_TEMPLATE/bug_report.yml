name: Bug report
description: 报告可复现的插件问题（请勿包含凭据或账户资料）
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请移除 API Key、Cookie、OAuth code、账户余额、付款资料和私有响应。
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: 例如 0.1.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: DeepSeek Harness、Node.js、操作系统及相关 Grok/Codex 插件版本
      placeholder: Harness 0.1.1-rc.2, Node 24.x, macOS 15
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: 当前 Provider
      options:
        - DeepSeek
        - Grok
        - Codex
        - 自定义或无法识别的 Provider
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、可重复且不包含私密数据的步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与脱敏错误
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 已尝试的排查
      description: 例如是否检查 API Key 配置、等待限频、确认可选插件已安装。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认内容中没有 API Key、Cookie、OAuth code、账户/付款资料或可直接使用的私有响应。
          required: true
