name: Feature request
description: 提议新的用户能力或兼容性改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 请描述需要解决的场景，而不只是实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 当前如何绕过，或考虑过哪些更小的改动？
  - type: textarea
    id: impact
    attributes:
      label: 安全与兼容性影响
      description: 是否涉及凭据、RPC、Provider 识别、外部网页、账户或付款？
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 此建议不要求插件读取网页 Cookie、密码或付款资料，也不要求在公开 Issue 中提供真实凭据。
          required: true
